function ana(sd,t){const ph=(s,i)=>{const T=S.tm[s.r],ids=o=>Object.entries(t[o]||{}).filter(([,x])=>x==s.r).map(([p])=>p).filter(p=>S.P[p]),inP=ids('adds'),outP=ids('drops'),k=(t.created/1000|0)+i,pk=(...x)=>x[k%x.length],best=a=>[...a].sort((x,y)=>rv(y)-rv(x))[0],top=(pos,ex)=>best(T.pl.filter(p=>S.P[p]?.[1]==pos&&!ex.includes(p))),o=[];
 const bi=best(inP);if(bi){const pos=S.P[bi][1],pt=top(pos,[bi]);o.push(!pt?pk(`${pn(bi)} fills a glaring hole at ${pos}`,`${pn(bi)} lands in a ${pos} room that was a wasteland`):rv(bi)>=rv(pt)?pk(`${pn(bi)} now leads the ${pos} room with ${pn(pt)} behind him, a legit two-headed monster`,`${pn(bi)} takes over ${pos}1 and pushes ${pn(pt)} into a supporting role`):`${pn(bi)} slots in behind ${pn(pt)} as ${pos} depth`)}
 const bo=best(outP);if(bo){const pos=S.P[bo][1],pt=top(pos,[]);o.push(!pt?`but the ${pos} room is bare after losing ${pn(bo)}`:rv(pt)<rv(bo)*.5?`but losing ${pn(bo)} leaves ${pn(pt)} carrying ${pos}`:`and can afford to lose ${pn(bo)} with ${pn(pt)} still around`)}
 const pc=(t.draft_picks||[]).filter(x=>x.owner_id==s.r).length;if(pc)o.push(`while banking ${pc} pick${pc>1?'s':''}`);
 const po=S.po?.[s.r];o.push(po==null?'':po>.6?'a win-now move for a contender':po<.25?`a seller's move for a team with long playoff odds`:'a move for a team on the playoff bubble');
 return`${tn(s.r)}: ${o.filter(Boolean).join(', ')}.`},w=[...sd].sort((a,b)=>b.tot-a.tot),dv=+(w[0].tot-w[1].tot).toFixed(1);
 return sd.map(ph).join(' ')+' '+(!S.V?'':dv<8?'On value this one is basically even.':`${tn(w[0].r)} wins the value battle by ${dv} points.`)}
function tcard(t){const sd=sides(t),T=sd.reduce((a,b)=>a+b.tot,0)||1;return`<div class="c"><div class="mu sm">${dt(t)}</div><div class="tg" style="grid-template-columns:repeat(${sd.length},1fr)">${sd.map(s=>`<div class="c"><b>${tw(s.r)}</b><div class="mu sm">Gets</div><ul>${s.as.map(x=>`<li><span>${x.n}</span><b>${S.V?(x.est?'~':'')+(x.v>=85?'👑 ':'')+x.v:'–'}</b></li>`).join('')||'<li>—</li>'}</ul><div class="row" style="justify-content:space-between"><span class="sm mu">Total ${s.tot}</span><span class="gr">${S.V?gr(s.tot/T):'–'}</span></div></div>`).join('')}</div><p class="sm" style="margin-top:10px">🧠 ${ana(sd,t)}</p></div>`}
function trades(){const k=S.tx.filter(t=>t.type=='trade');if(!k.length)return`<div class="c mu">No trades yet this season.</div>`;
 return k.slice(0,2).map(tcard).join('')+(k.length>2?`<details class="c"><summary>Show ${k.length-2} more trade${k.length>3?'s':''}</summary>${k.slice(2).map(tcard).join('')}</details>`:'')+`<p class="mu sm" style="margin:4px">${S.V?`Values are 0-100 (${S.V.k.replace('_',' ')}) from <a href="https://rosteraudit.com" style="color:var(--ac)">RosterAudit.com</a>. ~ means estimated, 👑 means priceless (top-tier values are compressed so the scale stays readable).`:'Trade values are unavailable right now.'}</p>`}

 <a class="btn" href="https://sleeper.com/leagues/${ID}">🔗 Open THE LEAGUE in Sleeper</a>`;
 const sx=(id,t,b,o=0)=>`<details class="sx" id="s-${id}"${(S.op?S.op.includes('s-'+id):o)?' open':''}><summary>${t}</summary>${b}</details>`,bm=[['rk','📈 Rankings'],['tw','🏆 Team of the Week'],['st','📊 Standings'],['pk','🎯 Draft Picks'],['tr','🤝 Trades']];
 $('#league').innerHTML=`<div class="pills"><button class="p" onclick="colAll(this)">⌃</button>${bm.map(b=>`<button class="p" onclick="jump('${b[0]}')">${b[1]}</button>`).join('')}</div>`

 +sx('st','📊 Standings',`<div class="c"><div class="row mu sm"><span style="width:22px"></span><span style="flex:1">Team</span><span>W-L</span><span style="width:52px;text-align:right">PF</span><span style="width:44px;text-align:right">Playoffs</span></div>${[...S.T].sort(rk).map((t,i)=>`<div class="row${mine(t)}"><span class="mu" style="width:22px">${i+1}</span><span style="flex:1">${nm(t)}</span><span>${rec(t)}</span><span class="mu" style="width:52px;text-align:right">${t.pf.toFixed(0)}</span><span style="width:44px;text-align:right">${S.po?Math.round(S.po[t.id]*100)+'%':'–'}</span></div>`).join('')}</div>`)
 +sx('pk','🎯 Draft Picks',picks(),0)+sx('tr','🤝 Trades',trades());
 const m=LS('m')||'dark',t=LS('t')||'ravens';
 $('#settings').innerHTML=`<h2 style="margin-top:0">🎨 Theme</h2><select onchange="setT(this.value)">${Object.entries(TH).map(([k,v])=>`<option value="${k}"${k==t?' selected':''}>${v}</option>`).join('')}</select><div class="pills" style="position:static;margin-top:10px"><button class="p ${m=='dark'?'on':''}" onclick="setM('dark')">Dark</button><button class="p ${m=='light'?'on':''}" onclick="setM('light')">Light</button></div>
 <h2>👤 Your Team</h2><select onchange="setMe(this.value)">${S.T.map(x=>`<option value="${x.uid}"${x.uid==LS('me')?' selected':''}>${e(x.name)}${x.real?' ('+e(x.real)+')':''}</option>`).join('')}</select>
 <h2>📝 Changelog</h2><div class="c">${CH.slice(0,3).map(c=>`<div class="row sm"><b style="width:48px">${c.v}</b><span class="mu" style="flex:1">${e(c.s)}</span></div>`).join('')}</div>
 <h2>⚙️ App</h2><div class="c"><div class="row"><span style="flex:1">Version</span><span class="mu">${V}</span></div><div class="row sm mu">Trade values by <a href="https://rosteraudit.com" style="color:var(--ac)">RosterAudit.com</a></div><div class="row sm mu">FantasyPros data: ${S.FP?new Date(S.FP.ts).toLocaleString()+(S.FP.stale?" (cached)":""):"not connected"}</div></div><button class="btn" onclick="chk(1)">Check for Updates</button>`;
}

 try{while(id&&id!='0'&&out.length<8){const[L,wb,us,rs]=await Promise.all([J('/league/'+id),J(`/league/${id}/winners_bracket`),J(`/league/${id}/users`),J(`/league/${id}/rosters`)]),T=mkTeams(rs,us),f=wb.find(x=>x.p==1);out.push({y:L.season,c:T.find(t=>t.id==f?.w),r:T.find(t=>t.id==f?.l)});id=L.previous_league_id}}catch{}
 S.H=out;$('#history').innerHTML=`<h2 style="margin-top:0">🏆 Champions</h2>${out.map((h,i)=>`<button class="c" style="display:block;width:100%;text-align:left;border:0;color:inherit" onclick="season(${i})"><div class="mu sm">${h.y}</div><b style="font-size:20px">${h.c?e(h.c.name):'No champion found'}</b>${h.c?.real?`<div class="mu">${e(h.c.real)}</div>`:''}</button>`).join('')||'<div class="c mu">No past seasons found.</div>'}`}
