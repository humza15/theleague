<script>

const NOTES={'2025':'','2024':''};
const TH={ravens:'Ravens',niners:'49ers',raiders:'Raiders',browns:'Browns',bears:'Bears',eagles:'Eagles'};
const CH=[{v:'0.1.1',s:'Frosted glass, playoff odds and a sleeker layout.',f:'Frosted Glass look across all themes (toggle in Settings). Playoff odds in standings. Game of the Week blurb, players to watch and expected outcome. Collapsible League sections. Projected pick numbers like 1.01. Header and your matchup stay on every tab. Bottom bar fixed in place. Smaller text and emoji headers.'},{v:'0.1.0',s:'First build of THE LEAGUE.',f:'Home with Game of the Week, power rankings placeholder, recent moves and a Sleeper link. League with Team of the Week, standings, draft picks and trade history. History of past champions. Settings with 6 team themes and this changelog. Pick your team on first launch.'}];
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));

const rec=t=>`${t.w}-${t.l}${t.t?'-'+t.t:''}`;
const gp=t=>Math.max(1,t.w+t.l+t.t),wp=t=>(t.w+t.t/2)/gp(t),ppg=t=>t.pf/gp(t);

function mkTeams(rs,us){const c=LS('own')||{};const T=rs.map(r=>{const u=us.find(x=>x.user_id==r.owner_id)||{},n=u.metadata?.team_name||u.display_name||'Team '+r.roster_id,real=OWNERS[n.toLowerCase()]||OWNERS[(u.display_name||'').toLowerCase()]||OWNERS[r.owner_id]||c[r.owner_id];if(real&&r.owner_id)c[r.owner_id]=real;const s=r.settings;return{id:r.roster_id,uid:r.owner_id,name:n,real,w:s.wins||0,l:s.losses||0,t:s.ties||0,pf:(s.fpts||0)+(s.fpts_decimal||0)/100,pa:(s.fpts_against||0)+(s.fpts_against_decimal||0)/100}});LS('own',c);return T}
async function plr(){const p=LS('pl');if(p&&Date.now()-p.t<6048e5)return p.d;const r=await J('/players/nfl'),d={};for(const k in r){const x=r[k];if(['QB','RB','WR','TE','K','DEF'].includes(x.position)&&(x.team||x.position=='DEF'))d[k]=[x.full_name||(x.first_name+' '+x.last_name),x.position,x.team||''];}try{LS('pl',{t:Date.now(),d})}catch{}return d}
async function load(){
 try{
  const [st,L,us,rs,tp,P]=await Promise.all([J('/state/nfl'),J('/league/'+ID),J(`/league/${ID}/users`),J(`/league/${ID}/rosters`),J(`/league/${ID}/traded_picks`),plr()]);
  const T=mkTeams(rs,us),wk=Math.min(18,Math.max(1,st.week||1)),lw=Math.max(1,wk-1);
  S={st,L,T,P,tp,wk,lw,tm:Object.fromEntries(T.map(t=>[t.id,t]))};
  const [cur,last,tx]=await Promise.all([J(`/league/${ID}/matchups/${wk}`).catch(()=>[]),J(`/league/${ID}/matchups/${lw}`).catch(()=>[]),Promise.all(Array.from({length:wk},(_,i)=>J(`/league/${ID}/transactions/${i+1}`).catch(()=>[])))]);
  S.cur=cur;S.last=last;S.tx=tx.flat().filter(t=>t.status=='complete').sort((a,b)=>b.created-a.created);
  const pw=S.L.settings.playoff_week_start||15;S.fut=await Promise.all(Array.from({length:Math.max(0,pw-wk)},(_,i)=>J(`/league/${ID}/matchups/${wk+i}`).catch(()=>[])));sim();

  draw();hist();
 }catch(x){$('#home').innerHTML=`<h1>THE LEAGUE</h1><div class="c">Couldn't load Sleeper data. Check your connection and try again.<button class="btn" onclick="location.reload()">Retry</button></div>`}
}
function pick(){$('#ov').innerHTML=`<div class="ov"><div class="sh"><h2 style="margin-top:0">Which team is yours?</h2><p class="mu sm" style="margin:0 4px 10px">You'll be highlighted throughout the app. Change it any time in Settings.</p>${S.T.map(t=>`<button class="c" style="display:block;width:100%;text-align:left;border:0;color:inherit;margin-bottom:8px" onclick="setMe('${t.uid}')">${nm(t)}</button>`).join('')}</div></div>`}
function setMe(u){LS('me',u);$('#ov').innerHTML='';draw()}
function star(r){const m=S.last.find(x=>x.roster_id==r);let b=null;(m?.starters||[]).forEach((p,i)=>{const v=m.starters_points?.[i]||0;if(S.P[p]&&(!b||v>b.v))b={p,v}});return b?`${pn(b.p)} (${b.v.toFixed(1)} last week)`:'—'}
function gotw(){const g={};S.cur.forEach(m=>m.matchup_id&&(g[m.matchup_id]??=[]).push(m));const R=[...S.T].sort(rk).map(t=>t.id),n=S.T.length;
 const sc=([a,b])=>{const x=S.tm[a.roster_id],y=S.tm[b.roster_id],ra=R.indexOf(x.id),rb=R.indexOf(y.id);return(1-(ra+rb)/2/n)*1.2+(1-Math.abs(ra-rb)/n)+(1-Math.min(1,Math.abs(ppg(x)-ppg(y))/30))*.6+(1-Math.abs(wp(x)-wp(y)))*.6};
 const best=Object.values(g).filter(a=>a.length==2).sort((p,q)=>sc(q)-sc(p))[0];
 if(!best)return`<div class="c mu">No matchups yet this week.</div>`;
 const[x,y]=best.map(m=>S.tm[m.roster_id]),ra=R.indexOf(x.id)+1,rb=R.indexOf(y.id)+1,p=1/(1+Math.exp(-(ppg(x)-ppg(y))/10)),f=p>=.5?x:y,u=f==x?y:x,pc=t=>S.po?Math.round(S.po[t.id]*100)+'%':'–';
 return`<div class="vs"><div class="o" style="margin-bottom:10px">🏈 Game of the Week</div><div class="t"><div><b>${e(x.name)}</b><span class="o">${x.real?e(x.real)+' · ':''}${rec(x)}</span></div><span class="x">VS</span><div style="text-align:right"><b>${e(y.name)}</b><span class="o">${y.real?e(y.real)+' · ':''}${rec(y)}</span></div></div><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>
 <p class="sm">${e(x.name)} (#${ra}) meets ${e(y.name)} (#${rb}) in the week's biggest swing game. ${e(f.name)} has the hotter bat at ${ppg(f).toFixed(1)} PPG to ${ppg(u).toFixed(1)}, but with playoff odds of ${pc(x)} and ${pc(y)}, neither side can afford a slip.</p>
 <p class="sm"><b>👀 Players to Watch</b><br>${e(x.name)}: ${star(x.id)}<br>${e(y.name)}: ${star(y.id)}</p>
 <p class="sm"><b>🔮 Expected Outcome</b><br>${e(f.name)} wins ${Math.round(Math.max(p,1-p)*100)}% of the time, based on scoring averages.</p></div>`}
function sim(){const pw=S.L.settings.playoff_week_start||15,k=S.L.settings.playoff_teams||6,N=3000,cnt={},g=[];S.T.forEach(t=>cnt[t.id]=0);
 S.fut.forEach(ms=>{const m={};ms.forEach(x=>x.matchup_id&&(m[x.matchup_id]??=[]).push(x.roster_id));Object.values(m).forEach(p=>p.length==2&&g.push(p))});
 for(let n=0;n<N;n++){const w={};S.T.forEach(t=>w[t.id]=t.w+t.t/2);g.forEach(([a,b])=>{const A=S.tm[a],B=S.tm[b];Math.random()<1/(1+Math.exp(-(ppg(A)-ppg(B))/10))?w[a]++:w[b]++});S.T.map(t=>[t.id,w[t.id]+t.pf/1e5+Math.random()*1e-3]).sort((p,q)=>q[1]-p[1]).slice(0,k).forEach(([i])=>cnt[i]++)}

 $('#hd').innerHTML=`<h1>THE LEAGUE</h1><div class="mu sm">${e(S.L.season)} Season · Week ${S.wk}</div>${o}`}
function mv(t){if(t.type=='trade')return`<b>Trade</b> ${t.roster_ids.map(tn).join(' ⇄ ')}`;const a=Object.entries(t.adds||{}).map(([p,r])=>`${tn(r)} added ${pn(p)}`),d=Object.entries(t.drops||{}).map(([p,r])=>`${tn(r)} dropped ${pn(p)}`);return[...a,...d].join('<br>')}
const dt=t=>new Date(t.created).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function totw(){const Q={QB:1,RB:2,WR:2,TE:1,K:1,DEF:1},pool={};
 S.last.forEach(m=>Object.entries(m.players_points||{}).forEach(([p,v])=>{const x=S.P[p];if(x&&Q[x[1]])(pool[x[1]]??=[]).push({p,v,r:m.roster_id,x})}));

function power(){const mx=Math.max(...S.T.map(t=>t.pf))||1;return S.T.map(t=>({t,s:wp(t)*.6+t.pf/mx*.4})).sort((a,b)=>b.s-a.s).map((o,i)=>`<div class="row${mine(o.t)}"><span class="mu" style="width:22px">${i+1}</span><span style="flex:1">${nm(o.t)}</span><span class="mu sm">${rec(o.t)}</span></div>`).join('')}
function picks(){const s0=+S.st.season+(['regular','post'].includes(S.st.season_type)?1:0),ys=[s0,s0+1,s0+2],nr=S.L.settings.draft_rounds||4,P=[],ord=[...S.T].sort(rk).map(t=>t.id).reverse(),oi=p=>ord.indexOf(p.o),lb=p=>p.r+'.'+String(oi(p)+1).padStart(2,'0');
 ys.forEach(y=>S.T.forEach(t=>{for(let r=1;r<=nr;r++)P.push({y,r,o:t.id,w:t.id})}));

 <h2>🔄 Recent Moves</h2><div class="c">${S.tx.slice(0,5).map(t=>`<div class="row"><span class="mu sm" style="width:46px">${dt(t)}</span><span class="sm" style="flex:1">${mv(t)}</span></div>`).join('')||'<span class="mu">No moves yet.</span>'}</div>
 <a class="btn" href="https://sleeper.com/leagues/${ID}">🔗 Open THE LEAGUE in Sleeper</a>`;
 const sx=(id,t,b)=>`<details class="sx" id="s-${id}" open><summary>${t}</summary>${b}</details>`,bm=[['rk','📈 Rankings'],['tw','🏆 Team of the Week'],['st','📊 Standings'],['pk','🎯 Draft Picks'],['tr','🤝 Trades']];
 $('#league').innerHTML=`<div class="pills">${bm.map(b=>`<button class="p" onclick="jump('${b[0]}')">${b[1]}</button>`).join('')}</div>`
 +sx('rk','📈 Power Rankings',`<div class="c">${power()}<p class="mu sm" style="margin-top:8px">Temporary order from record and points for.</p></div>`)
 +sx('tw','🏆 Team of the Week',`<div class="mu sm" style="margin:0 4px 8px">Week ${S.lw} · top scorer at each spot, half-PPR</div>${totw()}`)
 +sx('st','📊 Standings',`<div class="c"><div class="row mu sm"><span style="width:22px"></span><span style="flex:1">Team</span><span>W-L</span><span style="width:52px;text-align:right">PF</span><span style="width:44px;text-align:right">Playoffs</span></div>${[...S.T].sort(rk).map((t,i)=>`<div class="row${mine(t)}"><span class="mu" style="width:22px">${i+1}</span><span style="flex:1">${nm(t)}</span><span>${rec(t)}</span><span class="mu" style="width:52px;text-align:right">${t.pf.toFixed(0)}</span><span style="width:44px;text-align:right">${S.po?Math.round(S.po[t.id]*100)+'%':'–'}</span></div>`).join('')}</div>`)
 +sx('pk','🎯 Draft Picks',picks())+sx('tr','🤝 Trades',trades());
 const m=LS('m')||'dark',t=LS('t')||'ravens';
 $('#settings').innerHTML=`<h2 style="margin-top:0">🎨 Theme</h2><select onchange="setT(this.value)">${Object.entries(TH).map(([k,v])=>`<option value="${k}"${k==t?' selected':''}>${v}</option>`).join('')}</select><div class="pills" style="position:static;margin-top:10px"><button class="p ${m=='dark'?'on':''}" onclick="setM('dark')">Dark</button><button class="p ${m=='light'?'on':''}" onclick="setM('light')">Light</button><button class="p ${(LS('g')||'on')=='on'?'on':''}" onclick="setG((LS('g')||'on')=='on'?'off':'on')">🧊 Frosted Glass</button></div>
 <h2>👤 Your Team</h2><select onchange="setMe(this.value)">${S.T.map(x=>`<option value="${x.uid}"${x.uid==LS('me')?' selected':''}>${e(x.name)}${x.real?' ('+e(x.real)+')':''}</option>`).join('')}</select>
 <h2>📝 Changelog</h2>${CH.slice(0,3).map(c=>`<details class="c"><summary><b>${c.v}</b> <span class="mu sm">${e(c.s)}</span></summary><p class="sm">${e(c.f)}</p></details>`).join('')}
 <h2>⚙️ App</h2><div class="c"><div class="row"><span style="flex:1">Version</span><span class="mu">${V}</span></div></div><button class="btn" onclick="chk(1)">Check for Updates</button>`;
}
async function hist(){const out=[];let id=S.L.previous_league_id;
 try{while(id&&id!='0'&&out.length<8){const[L,wb,us,rs]=await Promise.all([J('/league/'+id),J(`/league/${id}/winners_bracket`),J(`/league/${id}/users`),J(`/league/${id}/rosters`)]),T=mkTeams(rs,us),f=wb.find(x=>x.p==1);out.push({y:L.season,c:T.find(t=>t.id==f?.w),r:T.find(t=>t.id==f?.l)});id=L.previous_league_id}}catch{}
 S.H=out;$('#history').innerHTML=`<h2 style="margin-top:0">🏆 Champions</h2>${out.map((h,i)=>`<button class="c" style="display:block;width:100%;text-align:left;border:0;color:inherit" onclick="season(${i})"><div class="mu sm">${h.y}</div><b style="font-size:20px">${h.c?e(h.c.name):'No champion found'}</b>${h.c?.real?`<div class="mu">${e(h.c.real)}</div>`:''}</button>`).join('')||'<div class="c mu">No past seasons found.</div>'}`}
function season(i){const h=S.H[i],n=NOTES[h.y];$('#ov').innerHTML=`<div class="ov" onclick="if(event.target==this)this.innerHTML=''"><div class="sh"><div class="mu">${h.y} champion</div><h1>${h.c?e(h.c.name):'—'}</h1><div class="mu">${h.c?.real?e(h.c.real)+' · ':''}${h.c?rec(h.c)+' · '+h.c.pf.toFixed(1)+' PF':''}</div>${h.r?`<p class="sm mu" style="margin-top:10px">Beat ${e(h.r.name)} in the final</p>`:''}<h2>📖 Season Recap</h2><p>${n?e(n):'<span class="mu">This season\'s story is coming soon.</span>'}</p><button class="btn" onclick="$('#ov').innerHTML=''">Close</button></div></div>`}
function jump(i){const d=document.getElementById('s-'+i);d.open=true;d.scrollIntoView({behavior:'smooth'})}function setG(v){LS('g',v);theme();draw()}function setT(t){LS('t',t);theme()}function setM(m){LS('m',m);theme();draw()}
function theme(){document.documentElement.dataset.g=LS('g')||'on';document.documentElement.dataset.t=LS('t')||'ravens';document.documentElement.dataset.m=LS('m')||'dark'}
function tab(n){document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==n));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.n==n));$('#sc').scrollTo(0,0)}
$('#nav').innerHTML=[['home','⌂','Home'],['league','☰','League'],['history','◷','History'],['settings','⚙','Settings']].map(([n,i,l])=>`<button data-n="${n}" class="${n=='home'?'on':''}" onclick="tab('${n}')"><i>${i}</i>${l}</button>`).join('');
async function chk(m){try{const r=await fetch('version.json?'+Date.now(),{cache:'no-store'}),j=await r.json();if(j.v!==V)$('#up').style.display='flex';else if(m)alert('You are on the latest version ('+V+').')}catch{if(m)alert("Couldn't check for updates.")}}
async function reload(){try{(await navigator.serviceWorker.getRegistrations()).forEach(r=>r.unregister());(await caches.keys()).forEach(k=>caches.delete(k))}catch{}location.reload()}
theme();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
document.addEventListener('visibilitychange',()=>!document.hidden&&chk());
chk();load();
</script></body></html>
